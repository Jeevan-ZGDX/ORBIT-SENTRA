version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: astra_guard_postgres
    environment:
      POSTGRES_USER: astra_user
      POSTGRES_PASSWORD: astra_password
      POSTGRES_DB: astra_guard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra_user -d astra_guard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
